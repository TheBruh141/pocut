[project]
name = "pocut"
version = "0.1.0"
description = "A Textual-based Pomodoro and Todo application for the terminal"
authors = [
    {name = "Bruh141", email = "141bruh@gmail.com"}
]
requires-python = ">=3.12"
readme = "README.md"
license = {text = "MIT"}
dependencies = [
    "pygame~=2.6.1",
    "toml~=0.10.2",
    "textual~=1.0.0",
    "rich~=13.9.4",
    "pytz~=2024.2",
    "uvicorn~=0.34.0",
    "fastapi~=0.115.6",
]

[project.optional-dependencies]
dev = [
    "pytest~=8.3.4",
    "pytest-asyncio",
    "Faker~=33.1.0",
    "black",
    "isort",
    "mypy",
    "ruff",
]

docs = [
    "sphinx",
    "sphinx-rtd-theme",
    "sphinxcontrib-napoleon",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
asyncio_mode = "auto"

[tool.black]
line-length = 88
target-version = ["py312"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
multi_line_output = 3
line-length = 88

[tool.ruff]
line-length = 88
target-version = "py312"
select = ["E", "F", "B", "I"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[project.scripts]
pocut = "pocut.app:main"